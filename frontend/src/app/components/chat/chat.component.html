<div class="chat-container">
  <!-- Header -->
  <div class="chat-header">
    <h1>📚 DocumentsRAG Chat</h1>
    <button class="clear-btn" (click)="clearChat()" [disabled]="messages.length === 0">
      Clear Chat
    </button>
  </div>

  <!-- Messages Container -->
  <div class="messages-container" #messagesContainer>
    <div *ngFor="let message of messages" class="message-wrapper" [ngClass]="message.sender">
      <div class="message" [ngClass]="message.sender">
        <!-- Loading State -->
        <div *ngIf="message.isLoading" class="loading-indicator">
          <span class="spinner"></span>
          <span>Thinking...</span>
        </div>

        <!-- Message Content -->
        <div *ngIf="!message.isLoading" class="message-content">
          <p>{{ message.text }}</p>

          <!-- Sources Section -->
          <div *ngIf="message.sources && message.sources.length > 0" class="sources-section">
            <button
              class="sources-toggle"
              (click)="toggleSources(message)"
              [class.active]="selectedMessage?.id === message.id"
            >
              📄 {{ message.sources.length }} Source(s)
              <span class="chevron">{{ selectedMessage?.id === message.id ? '▼' : '▶' }}</span>
            </button>

            <!-- Sources Details -->
            <div *ngIf="selectedMessage?.id === message.id" class="sources-list">
              <div *ngFor="let source of message.sources" class="source-item">
                <span class="source-file">{{ source.source }}</span>
                <span *ngIf="source.chunk_id !== undefined" class="source-meta">
                  Chunk #{{ source.chunk_id }}
                </span>
                <span *ngIf="source.page !== undefined" class="source-meta">
                  Page {{ source.page }}
                </span>
              </div>
            </div>
          </div>
        </div>

        <!-- Timestamp -->
        <span class="message-time">{{ formatDate(message.timestamp) }}</span>
      </div>
    </div>
  </div>

  <!-- Input Area -->
  <div class="input-area">
    <input
      type="text"
      [(ngModel)]="userInput"
      (keyup.enter)="sendMessage()"
      placeholder="Ask a question about your documents..."
      [disabled]="isLoading"
      class="message-input"
    />
    <button
      (click)="sendMessage()"
      [disabled]="isLoading || !userInput.trim()"
      class="send-btn"
    >
      {{ isLoading ? '⏳' : '➤' }} Send
    </button>
  </div>
</div>
